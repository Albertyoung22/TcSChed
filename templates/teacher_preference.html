<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師排課志願與偏好申報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --ink: #0f172a;
            --line: #e2e8f0;
            --pink: #db2777;
            --blue: #2563eb;
            --green: #16a34a;
            --red: #dc2626;
            --amber: #d97706;
            --locked: #cbd5e1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans TC", sans-serif;
            background: linear-gradient(180deg, #ffffff, #f8fafc 40%, #eef2ff);
            color: var(--ink);
            min-height: 100vh;
        }
        .wrap { max-width: 1320px; margin: 0 auto; padding: 24px; }
        .hero {
            background: linear-gradient(135deg, #111827, #1f2937 55%, #312e81);
            color: #fff;
            border-radius: 22px;
            padding: 22px 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, .14);
        }
        .hero-top { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand .ico {
            width: 48px; height: 48px; border-radius: 16px;
            display: grid; place-items: center;
            background: rgba(236, 72, 153, .16);
            color: #f9a8d4;
        }
        .brand h1 { margin: 0; font-size: 1.22rem; }
        .brand p { margin: 4px 0 0; color: #cbd5e1; font-size: .92rem; line-height: 1.5; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            border: none; border-radius: 10px; padding: 10px 14px;
            font: inherit; font-weight: 800; cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
        }
        .btn.white { background: #fff; color: #0f172a; }
        .btn.pink { background: linear-gradient(135deg, #ec4899, #db2777); color: #fff; }
        .btn.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        .grid { display: grid; grid-template-columns: 360px 1fr; gap: 18px; margin-top: 18px; }
        .card {
            background: #fff; border: 1px solid var(--line); border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .05); overflow: hidden;
        }
        .card-hd {
            padding: 14px 16px; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 900;
        }
        .card-bd { padding: 16px; }
        .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        label { font-size: .88rem; font-weight: 800; color: #334155; }
        select, input[type="number"] {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
            border-radius: 10px; font: inherit; background: #fff; color: #0f172a;
        }
        .help, .small { font-size: .82rem; color: #64748b; line-height: 1.6; }
        .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: #475569; margin-top: 10px; }
        .tag { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; }
        .dot.empty { background: #fff; border: 1px solid #cbd5e1; }
        .dot.block { background: #fee2e2; border: 1px solid #fca5a5; }
        .dot.pref { background: #dcfce7; border: 1px solid #86efac; }
        .dot.locked { background: #e2e8f0; border: 1px solid #94a3b8; }
        .notice {
            background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a;
            border-radius: 14px; padding: 12px 14px; line-height: 1.6; font-size: .9rem; margin-bottom: 14px;
        }
        .rulebox {
            border: 1px solid #dbeafe; background: #f8fbff;
            border-radius: 14px; padding: 12px; margin-bottom: 14px;
        }
        .rulebox h3 { margin: 0 0 8px; font-size: .92rem; }
        .rule-list { margin: 0; padding-left: 18px; color: #334155; line-height: 1.65; }
        .rule-empty { color: #94a3b8; font-size: .85rem; }
        .tablewrap { overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .86rem; }
        th, td { border: 1px solid var(--line); padding: 0; min-width: 120px; }
        th {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff; padding: 10px; text-align: center;
        }
        td.period {
            width: 74px; min-width: 74px; background: #f8fafc; text-align: center;
            font-weight: 800; color: #334155; padding: 10px;
        }
        td.slot {
            min-height: 72px; cursor: pointer; vertical-align: top; padding: 8px; position: relative;
        }
        td.slot:hover { filter: brightness(.975); }
        td.slot.state0 { background: #fff; }
        td.slot.state1 { background: #fee2e2; }
        td.slot.state2 { background: #dcfce7; }
        td.slot.locked {
            cursor: not-allowed;
            background:
                linear-gradient(135deg, rgba(226,232,240,.92), rgba(241,245,249,.96));
        }
        td.slot.locked::after {
            content: "系統鎖定";
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: .72rem;
            font-weight: 900;
            color: #475569;
            background: rgba(255,255,255,.9);
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            padding: 2px 6px;
        }
        .slot-label { font-weight: 900; font-size: .78rem; line-height: 1.35; padding-right: 56px; }
        .slot-sub { font-size: .72rem; color: #64748b; margin-top: 4px; line-height: 1.35; }
        .savebar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .toast {
            position: fixed; right: 18px; bottom: 18px; background: #0f172a; color: #fff;
            padding: 12px 16px; border-radius: 10px; font-weight: 800;
            box-shadow: 0 14px 28px rgba(0,0,0,.25); opacity: 0; transform: translateY(24px);
            transition: .2s; z-index: 9999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .statuspill {
            display: inline-flex; align-items: center; gap: 6px; font-size: .8rem;
            padding: 4px 10px; border-radius: 999px; background: #f1f5f9; color: #334155;
        }
        @media (max-width: 960px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="hero">
        <div class="hero-top">
            <div class="brand">
                <div class="ico"><i class="fa-solid fa-user-gear"></i></div>
                <div>
                    <h1>教師排課志願與偏好申報</h1>
                    <p>先顯示系統原本已設定的不排課與限制規則，已鎖定的格子不能改，避免覆蓋既有設定。</p>
                </div>
            </div>
            <div class="actions">
                <button class="btn blue" id="reloadBtn" type="button"><i class="fa-solid fa-rotate"></i> 重新載入</button>
                <button class="btn pink" id="saveBtn" type="button"><i class="fa-solid fa-cloud-arrow-up"></i> 儲存申報</button>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-hd"><span><i class="fa-solid fa-sliders"></i> 基本設定</span></div>
            <div class="card-bd">
                <div class="field">
                    <label for="teacherSelect">申報教師</label>
                    <select id="teacherSelect"></select>
                </div>

                <div class="rulebox">
                    <h3><i class="fa-solid fa-shield-halved"></i> 系統既有規則</h3>
                    <div id="systemRulesHint" class="rule-empty">請先選擇教師，系統會顯示原本已設定的不排課與限制規則。</div>
                    <ul id="systemRulesList" class="rule-list" style="display:none;"></ul>
                </div>

                <div class="field">
                    <label>偏好型態</label>
                    <label><input type="radio" name="style" value="none" checked> 不設定偏好</label>
                    <label><input type="radio" name="style" value="compact"> 偏向集中排課</label>
                    <label><input type="radio" name="style" value="spread"> 偏向分散排課</label>
                </div>

                <div class="field">
                    <label><input type="checkbox" id="avoidFirstLast"> 避開第一節與最後一節</label>
                    <label><input type="checkbox" id="avoidSplitShifts"> 避免中間斷堂</label>
                </div>

                <div class="field">
                    <label for="maxDaily">每日最多排課節數</label>
                    <input type="number" id="maxDaily" min="1" max="8" placeholder="留白代表不限制">
                </div>

                <div class="notice">
                    紅色 = 禁排<br>
                    綠色 = 偏好<br>
                    灰色 = 系統鎖定，不能修改<br>
                    鎖定格子會優先顯示原本的設定。
                </div>

                <div class="legend">
                    <div class="tag"><span class="dot empty"></span> 空白</div>
                    <div class="tag"><span class="dot block"></span> 禁排</div>
                    <div class="tag"><span class="dot pref"></span> 偏好</div>
                    <div class="tag"><span class="dot locked"></span> 系統鎖定</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-hd">
                <span><i class="fa-solid fa-calendar-check"></i> 排課志願表</span>
                <span id="statusText" class="statuspill"></span>
            </div>
            <div class="card-bd">
                <div class="help">請先檢查左側系統規則。已鎖定的節次代表原本就有不排課或限制規則，這些格子會直接顯示並禁止調整。</div>
                <div class="tablewrap" style="margin-top:12px;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:74px;">節次</th>
                                <th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th>
                            </tr>
                        </thead>
                        <tbody id="gridBody"></tbody>
                    </table>
                </div>
                <div class="savebar">
                    <button class="btn white" id="clearBtn" type="button"><i class="fa-solid fa-eraser"></i> 清空申報</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
let teachers = [];
let systemRules = { no_teach: {}, no_sub: {}, blocked_slots: [] };
let lockedSlotMap = new Map();
let currentTeacherCode = '';

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}

function slotKey(day, period) {
    return `${day}-${period}`;
}

function buildGrid() {
    const tb = document.getElementById('gridBody');
    tb.innerHTML = '';
    for (let p = 1; p <= 8; p++) {
        const tr = document.createElement('tr');
        const ptd = document.createElement('td');
        ptd.className = 'period';
        ptd.textContent = `第${p}節`;
        tr.appendChild(ptd);
        for (let d = 1; d <= 5; d++) {
            const td = document.createElement('td');
            td.className = 'slot state0';
            td.dataset.day = d;
            td.dataset.period = p;
            td.dataset.state = '0';
            td.innerHTML = '<div class="slot-label"></div><div class="slot-sub"></div>';
            td.addEventListener('click', () => {
                if (td.classList.contains('locked')) {
                    toast(td.dataset.lockReason || '這個節次已被系統鎖定');
                    return;
                }
                const next = (parseInt(td.dataset.state, 10) + 1) % 3;
                setCellState(td, next);
            });
            tr.appendChild(td);
        }
        tb.appendChild(tr);
    }
}

function setCellState(td, state, options = {}) {
    td.dataset.state = String(state);
    td.classList.remove('state0', 'state1', 'state2');
    td.classList.add(`state${state}`);
    const label = td.querySelector('.slot-label');
    const sub = td.querySelector('.slot-sub');
    const locked = !!options.locked;
    const reason = options.reason || '';
    td.classList.toggle('locked', locked);
    td.dataset.lockReason = reason;

    if (state === 0) {
        label.textContent = locked ? '系統鎖定' : '';
        sub.textContent = reason;
    }
    if (state === 1) {
        label.textContent = locked ? '系統禁排' : '禁排';
        sub.textContent = reason;
    }
    if (state === 2) {
        label.textContent = locked ? '系統偏好' : '偏好';
        sub.textContent = reason;
    }
}

function clearLockedState() {
    lockedSlotMap = new Map();
    document.querySelectorAll('#gridBody td.slot').forEach(td => {
        td.classList.remove('locked');
        td.dataset.lockReason = '';
    });
}

function resetForm(keepLocked = true) {
    document.querySelectorAll('input[name="style"]').forEach(r => r.checked = r.value === 'none');
    document.getElementById('avoidFirstLast').checked = false;
    document.getElementById('avoidSplitShifts').checked = false;
    document.getElementById('maxDaily').value = '';
    document.querySelectorAll('#gridBody td.slot').forEach(td => {
        const key = slotKey(td.dataset.day, td.dataset.period);
        if (keepLocked && lockedSlotMap.has(key)) {
            const info = lockedSlotMap.get(key);
            setCellState(td, info.state, { locked: true, reason: info.reason });
        } else {
            setCellState(td, 0);
        }
    });
}

function renderSystemRules(code) {
    const hint = document.getElementById('systemRulesHint');
    const list = document.getElementById('systemRulesList');
    const items = [];

    const noTeach = systemRules.no_teach?.[code] || [];
    if (noTeach.length) {
        items.push(`本教師原本不排課：${noTeach.join('、')}`);
    }

    const blocked = systemRules.blocked_slots || [];
    if (blocked.length) {
        items.push(`全校鎖定時段：${blocked.join('、')}`);
    }

    const noSubCount = Object.keys(systemRules.no_sub || {}).length;
    if (noSubCount) {
        items.push(`課程限制資料：${noSubCount} 筆`);
    }

    if (!items.length) {
        hint.style.display = 'block';
        list.style.display = 'none';
        list.innerHTML = '';
        hint.textContent = '這位教師目前沒有讀到系統既有的鎖定規則。';
        return;
    }

    hint.style.display = 'none';
    list.style.display = 'block';
    list.innerHTML = '';
    items.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        list.appendChild(li);
    });
}

function applyLockedSlots(code) {
    clearLockedState();
    if (!code) return;

    const locked = new Map();
    const addSlot = (day, period, state, reason) => {
        const key = slotKey(day, period);
        if (!locked.has(key)) {
            locked.set(key, { state, reason });
        }
    };

    (systemRules.no_teach?.[code] || []).forEach(s => {
        const [d, p] = s.split('-').map(Number);
        if (d && p) addSlot(d, p, 1, '系統原本設定不排課');
    });

    (systemRules.blocked_slots || []).forEach(s => {
        const [d, p] = s.split('-').map(Number);
        if (d && p) addSlot(d, p, 1, '全校鎖定時段');
    });

    lockedSlotMap = locked;
    document.querySelectorAll('#gridBody td.slot').forEach(td => {
        const key = slotKey(td.dataset.day, td.dataset.period);
        const info = lockedSlotMap.get(key);
        if (info) {
            setCellState(td, info.state, { locked: true, reason: info.reason });
        }
    });
}

async function loadTeachers() {
    const sel = document.getElementById('teacherSelect');
    sel.innerHTML = '<option value="">-- 請選擇教師 --</option>';
    const res = await fetch('/api/metadata');
    const data = await res.json();
    teachers = Array.isArray(data.teachers) ? data.teachers : [];
    teachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.code;
        opt.textContent = `${t.name} (${t.code})`;
        sel.appendChild(opt);
    });
}

async function loadSystemRules() {
    const [rulesRes, blockedRes] = await Promise.all([
        fetch('/api/config-rules'),
        fetch('/api/school-wide-blocked-slots')
    ]);
    const data = await rulesRes.json().catch(() => ({}));
    const blockedData = await blockedRes.json().catch(() => ({}));
    if (data && data.status !== 'error') {
        systemRules.no_teach = data.no_teach || {};
        systemRules.no_sub = data.no_sub || {};
    }
    if (blockedData && blockedData.status !== 'error') {
        systemRules.blocked_slots = Array.isArray(blockedData.blocked_slots) ? blockedData.blocked_slots : [];
    }
}

async function loadPreferences(code) {
    currentTeacherCode = code || '';
    resetForm(true);
    renderSystemRules(code);
    applyLockedSlots(code);
    if (!code) {
        document.getElementById('statusText').textContent = '';
        return;
    }

    document.getElementById('statusText').textContent = `目前：${code}`;
    const res = await fetch(`/api/teacher/preferences?code=${encodeURIComponent(code)}`);
    const data = await res.json();
    if (data.status !== 'success') {
        toast(data.message || '讀取失敗');
        return;
    }

    const prefs = data.preferences || {};
    const style = prefs.style || 'none';
    const styleRadio = document.querySelector(`input[name="style"][value="${style}"]`);
    if (styleRadio) styleRadio.checked = true;
    document.getElementById('avoidFirstLast').checked = !!prefs.avoid_first_last;
    document.getElementById('avoidSplitShifts').checked = !!prefs.avoid_split_shifts;
    document.getElementById('maxDaily').value = prefs.max_daily_periods ?? '';

    (prefs.blocked_slots || []).forEach(s => {
        const [d, p] = s.split('-');
        const td = document.querySelector(`#gridBody td[data-day="${d}"][data-period="${p}"]`);
        if (td && !td.classList.contains('locked')) {
            setCellState(td, 1);
        }
    });
    (prefs.preferred_slots || []).forEach(s => {
        const [d, p] = s.split('-');
        const td = document.querySelector(`#gridBody td[data-day="${d}"][data-period="${p}"]`);
        if (td && !td.classList.contains('locked')) {
            setCellState(td, 2);
        }
    });

    document.getElementById('statusText').textContent = `已載入：${code}`;
}

async function savePreferences() {
    const code = document.getElementById('teacherSelect').value.trim();
    if (!code) return toast('請先選擇教師');

    const style = document.querySelector('input[name="style"]:checked')?.value || 'none';
    const blocked_slots = [];
    const preferred_slots = [];

    document.querySelectorAll('#gridBody td.slot').forEach(td => {
        if (td.classList.contains('locked')) return;
        const key = `${td.dataset.day}-${td.dataset.period}`;
        if (td.dataset.state === '1') blocked_slots.push(key);
        if (td.dataset.state === '2') preferred_slots.push(key);
    });

    const body = {
        teacher_code: code,
        style,
        avoid_first_last: document.getElementById('avoidFirstLast').checked,
        avoid_split_shifts: document.getElementById('avoidSplitShifts').checked,
        max_daily_periods: document.getElementById('maxDaily').value ? parseInt(document.getElementById('maxDaily').value, 10) : null,
        blocked_slots,
        preferred_slots
    };

    const res = await fetch('/api/teacher/preferences', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.status === 'success') {
        toast(data.message || '儲存成功');
    } else {
        toast(data.message || '儲存失敗');
    }
}

document.getElementById('teacherSelect').addEventListener('change', e => loadPreferences(e.target.value));
document.getElementById('saveBtn').addEventListener('click', savePreferences);
document.getElementById('reloadBtn').addEventListener('click', async () => {
    await loadSystemRules();
    await loadTeachers();
    buildGrid();
    const code = document.getElementById('teacherSelect').value;
    if (code) await loadPreferences(code);
    toast('已重新載入');
});
document.getElementById('clearBtn').addEventListener('click', () => resetForm(true));

(async function init() {
    buildGrid();
    await loadSystemRules();
    await loadTeachers();
    toast('教師排課志願頁面已載入');
})();
</script>
</body>
</html>
