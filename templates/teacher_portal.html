<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🏫 教師個人課表查詢門戶 - 課表系統</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-green: #34d399;
            --accent-sky: #38bdf8;
            --accent-amber: #fbbf24;
            --accent-purple: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header Bar */
        .portal-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Teacher Selector Bar */
        .search-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            backdrop-filter: blur(12px);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .select-box {
            flex: 1;
            min-width: 220px;
        }

        .select-box select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Teacher Profile Card */
        .profile-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .teacher-meta {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent-sky);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent-sky);
        }

        .teacher-details h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-sky);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .stats-group {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            text-align: right;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Timetable Grid Table */
        .timetable-container {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        table.timetable {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed !important;
        }

        table.timetable th {
            background: rgba(30, 41, 59, 0.9);
            color: #38bdf8;
            padding: 14px 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            height: 48px !important;
            min-height: 48px !important;
            max-height: 48px !important;
            box-sizing: border-box !important;
        }

        table.timetable th:first-child,
        table.timetable td:first-child {
            width: 135px !important;
        }

        table.timetable th:nth-child(n+2),
        table.timetable td:nth-child(n+2) {
            width: 17.2% !important;
        }

        table.timetable td {
            padding: 6px 4px;
            height: 85px !important;
            min-height: 85px !important;
            max-height: 85px !important;
            box-sizing: border-box !important;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
            overflow: hidden !important;
        }


        .period-header {
            font-weight: 600;
            color: #818cf8;
            font-size: 0.85rem;
        }

        .period-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Lesson Slot Badges */
        .slot-card {
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
            height: 100%;
            transition: all 0.2s ease;
        }

        .slot-card:hover {
            transform: scale(1.03);
            border-color: #818cf8;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .slot-subject {
            font-weight: 700;
            color: #fff;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
        }

        .slot-class {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
        }

        .slot-room {
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
        }


        .slot-empty {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
        }

        /* Print Specific Styles */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
            }

            .portal-header, .search-card, .action-btns, .role-badge {
                display: none !important;
            }

            .container {
                max-width: 100% !important;
            }

            .profile-card {
                background: #f1f5f9 !important;
                border: 1px solid #cbd5e1 !important;
                color: #000 !important;
            }

            .profile-card h2 {
                color: #000 !important;
            }

            .stat-val {
                color: #059669 !important;
            }

            .timetable-container {
                border: 1px solid #94a3b8 !important;
                box-shadow: none !important;
            }

            table.timetable th {
                background: #e2e8f0 !important;
                color: #0f172a !important;
                border: 1px solid #cbd5e1 !important;
            }

            table.timetable td {
                border: 1px solid #cbd5e1 !important;
            }

            .slot-card {
                background: #eff6ff !important;
                border: 1px solid #93c5fd !important;
            }

            .slot-subject {
                color: #1e3a8a !important;
            }

            .slot-class {
                color: #0284c7 !important;
            }

            .slot-room {
                color: #475569 !important;
            }

            .slot-empty {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="portal-header">
            <div class="brand-info">
                <div class="brand-icon">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <div class="brand-text">
                    <h1 id="schoolNameHeader">臺南市立土城高級中學</h1>

                    <p id="semesterSubHeader">教師個人課表專屬查詢門戶</p>
                </div>

            </div>

            <div class="action-btns">
                <button class="btn btn-primary" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> 列印個人課表
                </button>
            </div>

        </header>

        <!-- Search & Select Teacher Card -->
        <div class="search-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="teacherSearchInput" placeholder="搜尋教師姓名或代碼 (如: 王大明)..." oninput="filterTeachers()">
            </div>

            <div class="select-box">
                <select id="teacherSelect" onchange="onTeacherSelected(this.value)">
                    <option value="">-- 請選擇教師 --</option>
                </select>
            </div>
        </div>

        <!-- Teacher Profile Card -->
        <div id="teacherProfileCard" class="profile-card" style="display: none;">
            <div class="teacher-meta">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div class="teacher-details">
                    <h2>
                        <span id="profTeacherName">--</span>
                        <span id="profTeacherRole" class="role-badge">專任教師</span>
                    </h2>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
                        教師代碼：<span id="profTeacherCode" style="color: #38bdf8; font-weight: 600;">--</span>
                    </p>
                </div>
            </div>

            <div class="stats-group">
                <div class="stat-item">
                    <div class="stat-label">每週授課總節數</div>
                    <div class="stat-val"><span id="profTotalHours">0</span> <span style="font-size: 0.9rem; font-weight: normal; color: var(--text-secondary);">節</span></div>
                </div>
            </div>
        </div>

        <!-- Timetable Grid -->
        <div class="timetable-container">
            <table class="timetable">
                <thead>
                    <tr>
                        <th>節次 / 時間</th>
                        <th>星期一</th>
                        <th>星期二</th>
                        <th>星期三</th>
                        <th>星期四</th>
                        <th>星期五</th>
                    </tr>
                </thead>
                <tbody id="timetableBody">
                    <tr><td colspan="6" style="padding: 40px; color: var(--text-secondary);">請於上方選擇教師以載入個人課表...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allTeachers = [];
        let periodTimesMap = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchSystemInfo();
            await loadTeachersData();

            // Auto load saved teacher selection from localStorage if available
            const savedTeacher = localStorage.getItem('selected_teacher_code');
            if (savedTeacher && allTeachers.some(t => String(t.code).trim() === String(savedTeacher).trim())) {
                document.getElementById('teacherSelect').value = savedTeacher;
                await renderTeacherSchedule(savedTeacher);
            }
        });

        async function fetchSystemInfo() {
            try {
                const resp = await fetch('/api/system-info');
                const data = await resp.json();
                if (data.status === 'success') {
                    if (data.school_name) {
                        document.getElementById('schoolNameHeader').innerText = data.school_name;
                    }
                    if (data.year && data.term) {
                        document.getElementById('semesterSubHeader').innerText = `${data.year} 學年度第 ${data.term} 學期 教師個人課表查詢門戶`;
                    }
                    periodTimesMap = data.period_times || {};
                }
            } catch (e) {
                console.error("Fetch system info failed:", e);
            }
        }

        async function loadTeachersData() {
            try {
                const resp = await fetch('/api/metadata');
                const data = await resp.json();
                allTeachers = data.teachers || [];

                populateTeacherDropdown(allTeachers);
            } catch (e) {
                console.error("Load metadata failed:", e);
            }
        }

        function populateTeacherDropdown(teachers) {
            const select = document.getElementById('teacherSelect');
            select.innerHTML = '<option value="">-- 請選擇教師 --</option>';

            const sorted = [...teachers].sort((a, b) => (a.code || '').localeCompare(b.code || ''));
            sorted.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.code;
                opt.textContent = `${t.name} (${t.code}) - ${t.role || '教師'}`;
                select.appendChild(opt);
            });
        }

        function filterTeachers() {
            const query = document.getElementById('teacherSearchInput').value.trim().toLowerCase();
            const filtered = allTeachers.filter(t => 
                (t.name || '').toLowerCase().includes(query) || 
                (t.code || '').toLowerCase().includes(query)
            );
            populateTeacherDropdown(filtered);

            if (filtered.length === 1) {
                const singleTeacher = filtered[0].code;
                document.getElementById('teacherSelect').value = singleTeacher;
                onTeacherSelected(singleTeacher);
            }
        }

        async function onTeacherSelected(teacherCode) {
            if (!teacherCode) {
                document.getElementById('teacherProfileCard').style.display = 'none';
                document.getElementById('timetableBody').innerHTML = '<tr><td colspan="6" style="padding: 40px; color: var(--text-secondary);">請於上方選擇教師以載入個人課表...</td></tr>';
                return;
            }
            localStorage.setItem('selected_teacher_code', teacherCode);
            await renderTeacherSchedule(teacherCode);
        }

        async function renderTeacherSchedule(teacherCode) {
            if (!teacherCode) return;

            const teacherObj = allTeachers.find(t => String(t.code).trim() === String(teacherCode).trim()) || { name: teacherCode, code: teacherCode, role: '教師' };
            
            // Fetch teacher schedule slots from backend
            let teacherSchedules = [];
            try {
                const resp = await fetch('/api/schedule/teacher/' + encodeURIComponent(teacherCode));
                teacherSchedules = await resp.json();
                if (!Array.isArray(teacherSchedules)) teacherSchedules = [];
            } catch (e) {
                console.error("Fetch teacher schedule failed:", e);
            }

            // Update Profile Card
            document.getElementById('teacherProfileCard').style.display = 'flex';
            document.getElementById('profTeacherName').innerText = teacherObj.name;
            document.getElementById('profTeacherCode').innerText = teacherObj.code;
            document.getElementById('profTeacherRole').innerText = teacherObj.role || '專任教師';
            document.getElementById('profTotalHours').innerText = teacherSchedules.length;

            // Build Timetable Matrix (5 Days x 8 Periods)
            const tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '';

            const days = ['1', '2', '3', '4', '5'];
            const periods = ['1', '2', '3', '4', '5', '6', '7', '8'];

            periods.forEach(p => {
                const tr = document.createElement('tr');
                
                // Period info column
                const pInfo = periodTimesMap[p] || { name: `第${p}節`, time: '' };
                const th = document.createElement('td');
                th.innerHTML = `<div class="period-header">${pInfo.name}</div><div class="period-time">${pInfo.time}</div>`;
                tr.appendChild(th);

                days.forEach(d => {
                    const td = document.createElement('td');
                    const slotLessons = teacherSchedules.filter(s => String(s.day) === d && String(s.period) === p);

                    if (slotLessons.length > 0) {
                        const lesson = slotLessons[0];
                        td.innerHTML = `
                            <div class="slot-card">
                                <div class="slot-subject">${lesson.subject_name || lesson.subject_code}</div>
                                <div class="slot-class"><i class="fa-solid fa-users"></i> ${lesson.class_name || lesson.class_code}</div>
                                ${lesson.room_name ? `<div class="slot-room"><i class="fa-solid fa-location-dot"></i> ${lesson.room_name}</div>` : ''}
                            </div>
                        `;
                    } else {
                        td.innerHTML = '<span class="slot-empty">-</span>';
                    }
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }
    </script>

</body>
</html>
