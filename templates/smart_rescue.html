<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧排課系統 - 智慧調整演示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#f8fafc; --ink:#0f172a; --line:#e2e8f0; --blue:#4f46e5; --cyan:#0ea5e9; --green:#10b981; --amber:#f59e0b; --red:#ef4444; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        .topbar { display:flex; align-items:center; gap:12px; padding:12px 18px; background:linear-gradient(135deg,#0f172a,#1e293b); color:#fff; border-bottom:1px solid rgba(255,255,255,.1); }
        .brand { font-weight:900; color:#a5b4fc; display:flex; align-items:center; gap:8px; }
        .title { font-weight:800; color:#fbbf24; }
        .actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
        .btn { border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer; font:inherit; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
        .btn:hover { background:rgba(255,255,255,.16); }
        .demo { display:none; padding:10px 18px; background:linear-gradient(135deg, rgba(14,165,233,.14), rgba(99,102,241,.14)); border-bottom:1px solid rgba(99,102,241,.18); color:#1e3a8a; font-size:.88rem; font-weight:700; }
        .metrics { display:flex; align-items:center; gap:18px; padding:10px 18px; background:#111827; color:#e5e7eb; font-size:.82rem; border-bottom:1px solid rgba(255,255,255,.08); }
        .metric b { font-size:1rem; color:#fff; }
        .bar { flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
        .bar > div { height:100%; width:0; background:linear-gradient(90deg, var(--green), var(--blue)); transition:width .35s ease; }
        .layout { display:grid; grid-template-columns: 340px 1fr; min-height:0; flex:1; }
        .left { border-right:1px solid var(--line); background:#fff; display:flex; flex-direction:column; min-height:0; }
        .left-head, .right-head { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; justify-content:space-between; }
        .left-head { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; }
        .left-search { padding:10px 12px; border-bottom:1px solid var(--line); }
        .left-search input { width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; }
        .list { padding:10px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
        .card { border:1px solid #dbe2ea; border-radius:12px; padding:12px; background:#f8fafc; cursor:pointer; transition:.15s; }
        .card:hover { border-color:#93c5fd; background:#eff6ff; }
        .card.active { border-color:#4f46e5; box-shadow:0 6px 18px rgba(79,70,229,.15); background:linear-gradient(135deg,#eff6ff,#f5f3ff); }
        .card.stashed { border-color:#38bdf8; background:#f0f9ff; }
        .name { font-weight:800; font-size:.95rem; }
        .meta { margin-top:6px; font-size:.8rem; color:#64748b; display:flex; gap:10px; flex-wrap:wrap; }
        .row-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
        .mini { border:1px solid; border-radius:7px; padding:6px 9px; font-weight:700; font:inherit; font-size:.76rem; cursor:pointer; background:#fff; }
        .mini.ok { border-color:var(--green); color:#065f46; }
        .mini.warn { border-color:#8b5cf6; color:#5b21b6; }
        .mini.info { border-color:#38bdf8; color:#0369a1; }
        .right { min-width:0; display:flex; flex-direction:column; min-height:0; }
        .banner { display:none; padding:12px 16px; background:#dbeafe; color:#1e3a8a; border-bottom:1px solid #bfdbfe; font-size:.88rem; line-height:1.6; }
        .guide { display:none; padding:12px 16px; border-bottom:1px solid var(--line); background:#f8fafc; color:#334155; font-size:.88rem; line-height:1.6; }
        .guide strong { color:#0f172a; }
        .right-head { background:#fff; }
        .right-head h2 { margin:0; font-size:1rem; }
        .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:.78rem; color:#475569; }
        .tag { display:flex; align-items:center; gap:4px; }
        .dot { width:12px; height:12px; border-radius:3px; }
        .table-wrap { padding:14px; overflow:auto; }
        table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 14px rgba(15,23,42,.06); }
        th { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:10px 8px; text-align:center; font-size:.85rem; }
        td { border:1px solid var(--line); min-width:140px; vertical-align:top; padding:0; }
        .period { width:72px; min-width:72px; text-align:center; background:#f1f5f9; color:#334155; font-weight:800; padding:8px; }
        .slot { min-height:74px; padding:6px; cursor:pointer; position:relative; }
        .slot:hover { filter:brightness(.96); }
        .slot.ok { background:rgba(16,185,129,.14); }
        .slot.warn { background:rgba(245,158,11,.14); }
        .slot.bad { background:rgba(239,68,68,.12); }
        .slot.soft { background:rgba(59,130,246,.12); }
        .slot.current { background:rgba(139,92,246,.16); border:2px dashed #8b5cf6; }
        .lesson { font-weight:800; font-size:.84rem; }
        .teacher { font-size:.74rem; color:#64748b; margin-top:2px; }
        .hint { margin-top:4px; font-size:.7rem; font-weight:700; }
        .green { color:#059669; } .amber { color:#b45309; } .red { color:#b91c1c; } .blue { color:#1d4ed8; }
        .badge { position:absolute; top:4px; right:4px; width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.63rem; font-weight:900; }
        .okdot { background:var(--green); } .warndot { background:var(--amber); } .reddot { background:var(--red); } .bluedot { background:var(--cyan); } .purdot { background:#8b5cf6; }
        .overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:9999; }
        .dialog { background:#fff; border-radius:14px; padding:22px; width:min(460px,92vw); box-shadow:0 30px 60px rgba(0,0,0,.28); }
        .dialog h3 { margin:0 0 8px; font-size:1.05rem; }
        .dialog p { margin:0 0 14px; white-space:pre-wrap; line-height:1.6; color:#475569; }
        .dialog-actions { display:flex; gap:8px; justify-content:flex-end; }
        .toast { position:fixed; right:18px; bottom:18px; background:#0f172a; color:#fff; padding:12px 16px; border-radius:10px; font-size:.88rem; font-weight:700; box-shadow:0 12px 28px rgba(0,0,0,.25); opacity:0; transform:translateY(24px); transition:.25s; z-index:10000; }
        .toast.show { opacity:1; transform:translateY(0); }
        @media (max-width: 960px) { .layout { grid-template-columns:1fr; } .left { max-height:42vh; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-calendar-days"></i> 智慧排課系統</div>
        <div class="title"><i class="fa-solid fa-wand-magic-sparkles"></i> 智慧調整演示</div>
        <div class="actions">
            <button class="btn" onclick="startDemo()"><i class="fa-solid fa-play"></i> AI 演示</button>
            <button class="btn" onclick="refreshAll()"><i class="fa-solid fa-rotate"></i> 重新整理</button>
            <a class="btn" href="/"><i class="fa-solid fa-arrow-left"></i> 回主畫面</a>
        </div>
    </div>
    <div id="demoStrip" class="demo">AI 演示模式已開啟。左邊選擇待調整課程，右邊點選可行時段，系統會即時展示調整原因與結果。</div>
    <div class="metrics">
        <div class="metric">待處理 <b id="failCnt">0</b></div>
        <div class="metric">已解決 <b id="okCnt">0</b></div>
        <div class="metric">暫存 <b id="bCnt">0</b></div>
        <div class="bar"><div id="pfill"></div></div>
        <div id="ppct" style="min-width:44px; text-align:right; font-weight:800;">0%</div>
    </div>
    <div class="layout">
        <div class="left">
            <div class="left-head"><span><i class="fa-solid fa-list"></i> 問題清單</span><span id="lbadge">0 筆</span></div>
            <div class="left-search"><input id="si" placeholder="搜尋班級 / 教師 / 科目..." oninput="filterList()"></div>
            <div id="demoPanel" style="display:none; padding:12px; border-bottom:1px solid var(--line); background:#eff6ff; color:#1e3a8a; font-size:.86rem; line-height:1.6;">
                <div style="font-weight:900; margin-bottom:6px;"><i class="fa-solid fa-circle-info"></i> 調整流程</div>
                <div>1. 點一筆課程</div>
                <div>2. 在右表挑一個時段</div>
                <div>3. 確認後直接套用</div>
            </div>
            <div id="rl" class="list"><div style="text-align:center; padding:30px; color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i><div style="margin-top:8px;">載入中...</div></div></div>
        </div>
        <div class="right">
            <div id="banner" class="banner"></div>
            <div class="right-head">
                <h2 id="rtitle"><i class="fa-solid fa-table-cells"></i> 課表調整區</h2>
                <div class="legend">
                    <div class="tag"><span class="dot" style="background:var(--green)"></span>可排</div>
                    <div class="tag"><span class="dot" style="background:var(--amber)"></span>警告</div>
                    <div class="tag"><span class="dot" style="background:var(--red)"></span>禁止</div>
                    <div class="tag"><span class="dot" style="background:var(--cyan)"></span>教師衝突</div>
                    <div class="tag"><span class="dot" style="background:#8b5cf6"></span>目前班級</div>
                </div>
                <div style="margin-left:auto;"><select id="cls" onchange="changeClass()" style="padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;font:inherit;"><option value="">選擇班級</option></select></div>
            </div>
            <div id="guide" class="guide"><strong>AI 調整演示</strong><br>左邊選課程，右邊點可行時段，系統會顯示是否可以直接調整、是否會衝堂，以及是否需要強制套用。</div>
            <div class="table-wrap"><table><thead><tr><th style="width:72px;">節次</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr></thead><tbody id="tbd"></tbody></table></div>
        </div>
    </div>
    <div class="overlay" id="cov">
        <div class="dialog">
            <h3 id="ct">確認調整</h3>
            <p id="cm"></p>
            <div class="dialog-actions">
                <button class="btn" style="color:#334155;background:#fff;border-color:#cbd5e1" onclick="hc()">取消</button>
                <button class="btn" id="fb" style="display:none;background:#ef4444;border-color:#ef4444" onclick="df()">強制套用</button>
                <button class="btn" id="cfb" style="background:#4f46e5;border-color:#4f46e5" onclick="dc()">確認套用</button>
            </div>
        </div>
    </div>
    <div class="toast" id="rt"></div>
    <script>
let ul=[], sl=[], sel=null, ssm={}, cc="", ccs=[], md=null, ok=0, cCb=null, fCb=null, demoMode=false;
async function init(){
    const params = new URLSearchParams(location.search);
    demoMode = params.get("demo") === "1";
    if (demoMode) {
        document.getElementById("demoStrip").style.display = "block";
        document.getElementById("demoPanel").style.display = "block";
        document.getElementById("guide").style.display = "block";
    }
    try{
        md = await (await fetch("/api/metadata")).json();
        if(md && md.classes){
            const cs = document.getElementById("cls");
            md.classes.forEach(c => {
                const o=document.createElement("option");
                o.value=c.code; o.textContent=c.name||c.code; cs.appendChild(o);
            });
        }
        await loadUL();
        if (cc) await loadCS(cc);
        if (demoMode && ul.length) selIt(ul[0]);
    } catch(e){ toast("載入失敗: "+e.message, "e"); }
}
async function loadUL(){
    const r=await fetch("/api/unscheduled-lessons");
    const d=await r.json();
    if(d.status==="success"){ ul=d.unscheduled||[]; sl=d.stashed||[]; renderList(); updateProg(); }
}
function filterList(){
    const q=document.getElementById("si").value.toLowerCase();
    document.querySelectorAll(".card").forEach(el=> el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none");
}
function updateProg(){ const t=ul.length+ok; document.getElementById("failCnt").textContent=ul.length; document.getElementById("okCnt").textContent=ok; document.getElementById("bCnt").textContent=sl.length; const p=t?Math.round(ok/t*100):0; document.getElementById("pfill").style.width=p+"%"; document.getElementById("ppct").textContent=p+"%"; }
function renderList(){
    const l=document.getElementById("rl");
    document.getElementById("lbadge").textContent = ul.length + " 筆";
    if(!ul.length){ l.innerHTML="<div style='text-align:center;padding:30px;color:#10b981;font-weight:800;'><i class='fa-solid fa-circle-check' style='font-size:2rem;display:block;margin-bottom:8px;'></i>目前沒有待處理項目</div>"; return; }
    l.innerHTML="";
    ul.forEach(item=>{
        const d=document.createElement("div");
        d.className="card" + (item._stashed ? " stashed" : "");
        d.dataset.id=item.id;
        d.innerHTML = `
            <div class="name">${item._stashed ? '<i class="fa-solid fa-inbox" style="color:#0284c7"></i> ' : ''}${item.subject_name || '未命名科目'}</div>
            <div class="meta"><span><i class="fa-solid fa-graduation-cap" style="color:#6366f1"></i> ${item.class_name || item.class_code || ''}</span><span><i class="fa-solid fa-chalkboard-user" style="color:#64748b"></i> ${item.teacher_name || '未指派'}</span></div>
            <div class="row-actions">
                <button class="mini ok" onclick="event.stopPropagation(); qp('${item.id}')"><i class="fa-solid fa-bolt"></i> 一鍵排入</button>
                <button class="mini warn" onclick="event.stopPropagation(); selIt(ul.find(x=>String(x.id)==='${item.id}'))"><i class="fa-solid fa-hand-pointer"></i> 手動選格</button>
                ${item._stashed ? `<button class="mini info" onclick="event.stopPropagation(); uns('${item.id}')"><i class="fa-solid fa-rotate-left"></i> 取回</button>` : `<button class="mini info" onclick="event.stopPropagation(); sta('${item.id}')"><i class="fa-solid fa-inbox"></i> 暫存</button>`}
            </div>`;
        d.addEventListener("click", ()=> selIt(item));
        l.appendChild(d);
    });
}
async function selIt(item){
    if(!item) return;
    sel=item;
    document.querySelectorAll(".card").forEach(el=>el.classList.remove("active"));
    const el=document.querySelector(`.card[data-id="${item.id}"]`); if(el) el.classList.add("active");
    document.getElementById("banner").style.display="block";
    document.getElementById("banner").innerHTML = `<i class="fa-solid fa-crosshairs"></i> 已選取 <strong>${item.subject_name || ''}</strong>，班級 ${item.class_name || item.class_code || ''}，教師 ${item.teacher_name || '未指派'}。請在右側挑選可調整時段。`;
    if(item.class_code && item.class_code !== cc){ cc=item.class_code; document.getElementById("cls").value=cc; await loadCS(cc); }
    else await fetchCM(item.id, cc);
}
function clearSel(){ sel=null; ssm={}; document.querySelectorAll(".card").forEach(el=>el.classList.remove("active")); document.getElementById("banner").style.display="none"; renderTT(ccs,{}); }
async function changeClass(){ cc=document.getElementById("cls").value; if(!cc) return; await loadCS(cc); }
async function loadCS(code){
    const r = await fetch(`/api/schedule/class/${encodeURIComponent(code)}`);
    ccs = await r.json();
    document.getElementById("rtitle").innerHTML = `<i class="fa-solid fa-table-cells"></i> ${code} 課表`;
    if(sel) await fetchCM(sel.id, code); else renderTT(ccs,{});
}
async function fetchCM(iid, code){
    const r = await fetch("/api/conflict-check-slot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({item_id:iid,class_code:code})});
    const d = await r.json();
    if(d.status==="success"){ ssm=d.slots||{}; renderTT(ccs,ssm); }
}
function renderTT(slots, sm){
    const tb=document.getElementById("tbd"); tb.innerHTML="";
    const g={};
    (slots||[]).forEach(s=>{ const dv=parseInt(s.day), pv=parseInt(s.period); if(dv>=1&&dv<=5&&pv>=1&&pv<=8){ g[pv] ||= {}; g[pv][dv] ||= []; g[pv][dv].push(s); }});
    const pt=(md&&md.period_times)||{};
    for(let p=1;p<=8;p++){
        const tr=document.createElement("tr");
        const td0=document.createElement("td"); td0.className="period";
        const pti=pt[String(p)] || {name:`第${p}節`, time:""};
        td0.innerHTML=`<div>${pti.name}</div><div style="font-size:.68rem;color:#94a3b8">${pti.time || ''}</div>`;
        tr.appendChild(td0);
        for(let d=1;d<=5;d++){
            const td=document.createElement("td");
            const key=`${d}-${p}`;
            const st=sm[key]||null;
            const ls=(g[p]&&g[p][d])||[];
            const box=document.createElement("div"); box.className="slot";
            if(st){
                const clsMap={feasible:"ok",warning:"warn",forbidden:"bad",forbidden_teacher:"soft",forbidden_subject:"bad",current:"current"};
                box.classList.add(clsMap[st.color] || "");
                const dot=document.createElement("div");
                dot.className="badge " + (st.color==="feasible"?"okdot":st.color==="warning"?"warndot":st.color==="current"?"purdot":"reddot");
                dot.textContent = st.color==="feasible" ? "✓" : st.color==="warning" ? "!" : st.color==="current" ? "◎" : "×";
                box.appendChild(dot);
            }
            ls.forEach(l=>{
                const n=document.createElement("div"); n.className="lesson"; n.textContent=l.subject_name||"";
                const t=document.createElement("div"); t.className="teacher"; t.textContent=l.teacher_name||"";
                box.appendChild(n); box.appendChild(t);
            });
            if(st && st.status !== "current"){
                const h=document.createElement("div");
                h.className="hint " + (st.color==="feasible"?"green":st.color==="warning"?"amber":"red");
                h.textContent = st.message ? st.message.slice(0, 24) : (st.color==="feasible" ? "可直接調整" : "需確認");
                box.appendChild(h);
            }
            box.addEventListener("click", ()=>{
                if(!sel){ toast("請先選擇左側課程", "w"); return; }
                if(!st || st.status==="current") return;
                const targetLesson = ls[0] || null;
                const msg = st.status.startsWith("forbidden")
                    ? `此格有衝突：\n${st.message || ""}\n\n是否仍要強制套用到 週${d} 第${p}節？`
                    : `此格可調整。\n${targetLesson ? `目標格目前有：${targetLesson.subject_name || ""}` : "此格目前是空的"}\n\n是否套用到 週${d} 第${p}節？`;
                showCnf("確認調整", msg, ()=>doPlace(sel.id, d, p, false), ()=>doPlace(sel.id, d, p, true), st.status.startsWith("forbidden"));
            });
            td.appendChild(box); tr.appendChild(td);
        }
        tb.appendChild(tr);
    }
}
async function qp(iid){
    toast("正在尋找最佳時段...", "i");
    const r=await fetch("/api/smart-rescue/place-lesson",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({item_id:iid,prefer_morning:true})});
    const d=await r.json();
    if(d.status==="success"){ toast("已自動調整"); ok++; await loadUL(); if(cc) await loadCS(cc); }
    else toast(d.message || "調整失敗", "e");
}
async function doPlace(iid, td, tp, force){
    hc();
    const r=await fetch("/api/execute-swap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_id:iid,target_day:td,target_period:tp,force})});
    const d=await r.json();
    if(d.status==="success"){ toast(d.message || "已套用"); ok++; sel=null; ssm={}; document.getElementById("banner").style.display="none"; await loadUL(); if(cc) await loadCS(cc); }
    else toast(d.message || "套用失敗","e");
}
async function sta(iid){ const r=await fetch("/api/stash-lesson",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:iid})}); const d=await r.json(); if(d.status==="success"){ toast(d.message || "已暫存"); await loadUL(); } }
async function uns(iid){ const r=await fetch("/api/unstash-lesson",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:iid,target_day:"0",target_period:"0"})}); const d=await r.json(); if(d.status==="success"){ toast("已取回"); await loadUL(); } }
function showCnf(t,m,okFn,forceFn,showForce){
    document.getElementById("ct").textContent=t;
    document.getElementById("cm").textContent=m;
    cCb=okFn; fCb=forceFn;
    document.getElementById("cfb").style.display="inline-flex";
    document.getElementById("fb").style.display=showForce ? "inline-flex" : "none";
    document.getElementById("cov").style.display="flex";
}
function hc(){ document.getElementById("cov").style.display="none"; cCb=null; fCb=null; }
function dc(){ if(cCb) cCb(); hc(); }
function df(){ if(fCb) fCb(); hc(); }
function refreshAll(){ sel=null; ssm={}; ok=0; document.getElementById("banner").style.display="none"; loadUL().then(()=> cc ? loadCS(cc) : null); toast("已重新整理"); }
function startDemo(){ location.href="/smart-rescue?demo=1"; }
